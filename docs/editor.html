<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイ・超リアルglTFエディタ</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #drop-zone { position: absolute; top: 10px; left: 10px; padding: 20px; background: rgba(0,0,0,0.7); color: white; border: 2px dashed #666; border-radius: 8px; pointer-events: none; }
        #ui-panel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; color: white; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 8px 12px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
    </style>
    <!-- Three.js と glTFインポータ/エクスポータをCDNから読み込み -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="drop-zone">ここにGLB/glTFファイルをドラッグ＆ドロップ</div>
    
    <div id="ui-panel">
        <h3>エディタコントロール</h3>
        <button id="add-light">リアルな太陽光を追加</button>
        <button id="export-glb">GLB形式で書き出し (無料・無制限)</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // 1. 基本的な3D空間（シーン・カメラ・レンダラー）の立ち上げ
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 超リアルな影を有効化
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // カメラをマウス操作できるようにする（グリグリ動かせる）
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // グリッド（床の目安）を表示
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 基本的な環境光（これがないと真っ暗になる）
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // 2. ドラッグ＆ドロップでGLTF/GLBを読み込む処理
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const contents = event.target.result;
                const loader = new GLTFLoader();
                loader.parse(contents, '', (gltf) => {
                    const model = gltf.scene;
                    // モデルに影を落とす・受ける設定を自動付与（リアル化）
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    scene.add(model);
                }, (error) => console.error(error));
            };
            reader.readAsArrayBuffer(file);
        });

        // 3. リアルな太陽光（影付き）を追加するボタン
        document.getElementById('add-light').addEventListener('click', () => {
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true; // 影を有効に
            dirLight.shadow.mapSize.width = 2048; // 影の解像度（超リアルに）
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            
            // 太陽の向きがわかりやすいようにヘルパーも追加
            const helper = new THREE.DirectionalLightHelper(dirLight, 1);
            scene.add(helper);
        });

        // 4. 完成したシーンを無制限にGLBとして書き出す処理
        document.getElementById('export-glb').addEventListener('click', () => {
            const exporter = new GLTFExporter();
            // グリッドやライトヘルパーを除外して、純粋な3Dモデルだけを書き出す
            exporter.parse(scene, (gltf) => {
                const blob = new Blob([gltf], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'my_classroom.glb';
                link.click();
            }, (error) => console.error(error), { binary: true });
        });

        // アニメーションループ（常に画面を描画し続ける）
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 画面サイズが変更されたときの対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
