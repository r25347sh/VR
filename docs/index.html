<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Classroom</title>
    <!-- あなたが見つけてくれた正しい最新のURL -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- アセット管理：3Dモデルのファイルをここで読み込みます -->
      <a-assets>
        <!-- 【重要】srcにあなたの教室のglTFファイルのURL（または相対パス）を指定してください -->
        <a-asset-item id="classroom-model" src="classroom.gltf"></a-asset-item>
      </a-assets>

      <!-- 教室の3Dモデルを空間に配置（位置や大きさを調整） -->
      

      <!-- カメラと環境光の追加（空間をきれいに見せるため） -->
      
      <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
    </a-scene>
  </body>
</html>
