<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello, WebVR 1.8.0!</title>
    <!-- あなたが教えてくれた正しい最新のURLです -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 赤いボックス（立方体） -->
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#CC0000"></a-box>
      <!-- 緑色の球体 -->
      <a-sphere position="1 1.25 -5" radius="1.25" color="#00CC00"></a-sphere>
      <!-- 地平面 -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <!-- 背景（空の色） -->
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
